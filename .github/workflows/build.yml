name: Build mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Unzip project
        run: unzip -q FPAuto-1.8.9-forge.zip
      - name: Get Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
      - name: Build
        working-directory: FPAuto
        run: ../gradle-2.14.1/bin/gradle setupDecompWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FPAuto-jar
          path: FPAuto/build/libs/*.jar
